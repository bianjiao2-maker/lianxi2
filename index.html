<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D数字工厂可视化系统</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>
        
        <div id="header">
            <h1>3D数字工厂可视化系统</h1>
            <div id="stats">
                <span id="fps">FPS: 0</span>
                <span id="time"></span>
            </div>
        </div>
        
        <div id="control-panel">
            <h3>控制面板</h3>
            <div class="control-group">
                <label>视图模式</label>
                <select id="view-mode">
                    <option value="perspective">透视视图</option>
                    <option value="top">俯视图</option>
                    <option value="front">前视图</option>
                    <option value="side">侧视图</option>
                </select>
            </div>
            <div class="control-group">
                <label>数据刷新频率</label>
                <select id="refresh-rate">
                    <option value="1000">1秒</option>
                    <option value="2000">2秒</option>
                    <option value="5000">5秒</option>
                </select>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="show-labels" checked>
                    显示数据标签
                </label>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="auto-rotate">
                    自动旋转
                </label>
            </div>
        </div>
        
        <div id="info-panel" class="hidden">
            <h3>设备信息</h3>
            <div id="device-info"></div>
            <button id="close-info">关闭</button>
        </div>
        
        <div id="legend">
            <h4>状态图例</h4>
            <div class="legend-item">
                <span class="color-box normal"></span>
                <span>正常 (0-60%)</span>
            </div>
            <div class="legend-item">
                <span class="color-box warning"></span>
                <span>警告 (60-80%)</span>
            </div>
            <div class="legend-item">
                <span class="color-box danger"></span>
                <span>危险 (80-100%)</span>
            </div>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
